# Vocabolario stili INIZIALE (dati, non codice). Estendibile senza toccare il sorgente.

# Come il `linework` di uno stile diventa l'istruzione di trattamento della linea nel
# brief/prompt. Sta QUI e non nel codice per il vincolo §2 dello spec: il codice conosce
# gli ASSI (linework), non i VALORI né i nomi degli stili.
# ⚠️ L'ORDINE È LA PRIORITÀ: se il brief mescola stili con linework diversi vince il primo
# di questa lista (il tratto più fine, perché uno stencil misto si disegna a linea fine).
line_treatments:
  thin: single-weight fine lines
  fine: single-weight fine lines
  thin-spiky: single-weight fine lines
  bold: bold black outlines
  soft: soft shaded linework
  _default: clean linework

# Vocabolario degli ASSI (spec §7): il codice conosce gli assi, i VALORI stanno qui.
# Ogni valore canonico elenca i modi in cui Matteo lo scrive davvero in chat, in italiano:
# è così che «rotondo» diventa `form=round` senza un modello e senza codice da toccare.
assi:
  form:
    round: [rotondo, rotonda, circolare, cerchio, tondo]
    linear: [lineare, striscia, verticale, colonna]
    geometric-shape: [triangolo, rombo, esagono]
    organic: [organico, sinuoso]
  color_mode:
    black-only: [nero, bianco e nero, b/n, solo nero, blackwork]
    color: [colore, colori, colorato, colorata]
    red-black: [rosso e nero]
  placement:
    forearm: [avambraccio]
    wrist: [polso]
    arm: [braccio]
    shoulder: [spalla]
    back: [schiena]
    chest: [petto]
    leg: [gamba, polpaccio, coscia]
    ankle: [caviglia]
    hand: [mano, dita, dito]
    neck: [collo]
    ribs: [costole, fianco]
  density:
    high: [pieno, carico, denso]
    low: [minimale, essenziale, leggero, piccolo]

styles:
  - name: blackwork
    description: campiture nere piene, forte spazio negativo
    formal_attributes: {palette: black-only, linework: bold, density: high}
  - name: fine-line
    aliases: [fineline, single-needle]
    description: linee sottili a spessore costante, minimale
    formal_attributes: {palette: black-only, linework: thin, density: low}
  - name: geometric
    description: forme geometriche, simmetria, pattern
    formal_attributes: {linework: bold, density: medium}
  - name: dotwork
    description: ombreggiatura a puntinato (stippling)
    formal_attributes: {palette: black-only, technique: stippling}
  - name: traditional
    aliases: [old-school]
    description: contorni spessi, colori piatti saturi
    formal_attributes: {linework: bold, palette: saturated}
  - name: neo-traditional
    description: evoluzione del traditional, più dettaglio e palette ampia
    formal_attributes: {linework: bold, palette: wide}
  - name: realism
    description: resa realistica, gradienti morbidi
    formal_attributes: {linework: soft, palette: grayscale-or-color}
  - name: minimalist
    description: pochi elementi, molto bianco, essenziale
    formal_attributes: {density: low}
  - name: ornamental
    aliases: [mandala]
    description: motivi decorativi, mandala, gioielleria
    formal_attributes: {density: high, linework: fine}
  - name: cybersigilism
    is_emerging: true
    description: tratti affilati tribali-digitali, spuntoni sottili
    formal_attributes: {linework: thin-spiky, palette: black-only}
